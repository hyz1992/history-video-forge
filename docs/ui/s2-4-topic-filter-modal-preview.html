<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S2-4 推荐筛选弹窗预览</title>
  <style>
    :root {
      --bg-card: #1f1b18;
      --bg-card-soft: #241f1b;
      --bg-page: #05070d;
      --text-heading: #f3ead9;
      --text-body: #d9cbb7;
      --text-secondary: #b8aa98;
      --text-muted: #7e7469;
      --text-inverse: #15100b;
      --accent-primary: #d4a35f;
      --accent-primary-light: #e4bd78;
      --accent-copper: #c56b47;
      --border-default: rgba(212, 163, 95, 0.14);
      --font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(41, 49, 66, 0.24), transparent 34%),
        var(--bg-page);
      color: var(--text-body);
      font-family: var(--font-family);
    }

    button,
    input {
      font: inherit;
    }

    .modal-overlay {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 6, 12, 0.72);
      backdrop-filter: blur(6px);
    }

    .modal-box {
      position: relative;
      width: 960px;
      max-width: 94vw;
      max-height: 90vh;
      min-height: 600px;
      overflow-y: auto;
      background: linear-gradient(180deg, #141c2b 0%, var(--bg-card) 160px);
      border: 1px solid var(--border-default);
      border-radius: 16px;
      box-shadow:
        0 0 0 1px rgba(212, 163, 95, 0.05),
        0 8px 48px rgba(0, 0, 0, 0.55),
        0 2px 12px rgba(0, 0, 0, 0.3);
      padding: 18px 54px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(212, 163, 95, 0.35), transparent);
      border-radius: 0 0 2px 2px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-default);
      border-radius: 50%;
      font-size: 15px;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      transition: all 200ms ease;
    }

    .modal-close:hover {
      color: var(--text-heading);
      background: rgba(212, 163, 95, 0.1);
      border-color: rgba(212, 163, 95, 0.3);
    }

    .modal-title {
      margin-left: -30px;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-heading);
      line-height: 1;
      padding-right: 40px;
    }

    .modal-tabs {
      margin-top: -10px;
      display: inline-flex;
      gap: 2px;
      align-self: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 5px;
      border: 1px solid rgba(212, 163, 95, 0.1);
    }

    .tab-btn {
      min-width: 108px;
      padding: 10px 28px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      position: relative;
    }

    .tab-btn:hover { color: var(--text-body); }

    .tab-btn--active {
      background: linear-gradient(135deg, rgba(212, 163, 95, 0.18), rgba(212, 163, 95, 0.08));
      color: var(--accent-primary);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .modal-filters {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 20px 16px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(212, 163, 95, 0.08);
      border-radius: 14px;
    }

    .basic-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
      gap: 14px 18px;
    }

    .filter-group {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-group--wide {
      grid-column: 1 / -1;
    }

    .filter-group--timeline {
      gap: 12px;
    }

    .child-filter {
      margin-top: 2px;
      padding: 12px 12px 10px;
      border-radius: 12px;
      border: 1px solid rgba(212, 163, 95, 0.08);
      background: rgba(0, 0, 0, 0.1);
    }

    .period-range-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      margin-top: 4px;
      padding: 2px 0 5px;
      overscroll-behavior-inline: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 163, 95, 0.26) transparent;
    }

    .period-range-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .period-range-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .period-range-scroll::-webkit-scrollbar-thumb {
      background: rgba(212, 163, 95, 0.24);
      border-radius: 4px;
    }

    .period-range {
      --period-count: 7;
      --range-left: 0%;
      --range-width: 100%;
      position: relative;
      min-width: 476px;
      padding: 4px 6px 0;
    }

    .period-track-shell {
      position: relative;
      height: 24px;
      margin-inline: calc(50% / var(--period-count));
    }

    .period-track,
    .period-track-active {
      position: absolute;
      top: 10px;
      height: 4px;
      border-radius: 4px;
    }

    .period-track {
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.045);
    }

    .period-track-active {
      top: 9px;
      left: var(--range-left);
      width: var(--range-width);
      height: 6px;
      background: #d9a85f;
      box-shadow: 0 0 12px rgba(217, 168, 95, 0.28);
    }

    .period-slider {
      position: absolute;
      top: 0;
      left: -9px;
      z-index: 3;
      width: calc(100% + 18px);
      height: 24px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      pointer-events: none;
    }

    .period-slider--end {
      z-index: 4;
    }

    .period-slider:focus-visible {
      outline: none;
    }

    .period-slider:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 4px rgba(212, 163, 95, 0.24), 0 2px 8px rgba(0, 0, 0, 0.42);
    }

    .period-slider:focus-visible::-moz-range-thumb {
      box-shadow: 0 0 0 4px rgba(212, 163, 95, 0.24), 0 2px 8px rgba(0, 0, 0, 0.42);
    }

    .period-slider::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
    }

    .period-slider::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 2px solid #2b241d;
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--accent-primary-light);
      box-shadow: 0 0 0 2px rgba(212, 163, 95, 0.2), 0 2px 8px rgba(0, 0, 0, 0.42);
      cursor: grab;
      pointer-events: auto;
    }

    .period-slider::-moz-range-track {
      height: 4px;
      background: transparent;
    }

    .period-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 2px solid #2b241d;
      border-radius: 50%;
      background: var(--accent-primary-light);
      box-shadow: 0 0 0 2px rgba(212, 163, 95, 0.2), 0 2px 8px rgba(0, 0, 0, 0.42);
      cursor: grab;
      pointer-events: auto;
    }

    .period-slider:active::-webkit-slider-thumb {
      cursor: grabbing;
      transform: scale(1.06);
    }

    .period-marks {
      display: grid;
      grid-template-columns: repeat(var(--period-count), minmax(0, 1fr));
      margin-top: -24px;
      pointer-events: none;
    }

    .period-mark {
      position: relative;
      min-width: 0;
      padding-top: 30px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }

    .period-mark::before {
      content: "";
      box-sizing: border-box;
      position: absolute;
      top: 8px;
      left: 50%;
      width: 8px;
      height: 8px;
      border: 2px solid #211c18;
      border-radius: 50%;
      background: #4c443b;
      transform: translateX(-50%);
      transition: background 160ms ease, box-shadow 160ms ease;
    }

    .period-mark--active {
      color: var(--accent-primary-light);
      font-weight: 600;
    }

    .period-mark--active::before {
      background: var(--accent-primary-light);
      box-shadow: 0 0 0 2px rgba(212, 163, 95, 0.12);
    }

    .period-empty {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .period-range[hidden],
    .period-empty[hidden] {
      display: none;
    }

    .period-selection {
      max-width: 72%;
      color: rgba(212, 163, 95, 0.78);
      font-size: 11px;
      line-height: 1.45;
      text-align: right;
    }

    .child-label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .child-label span {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
    }

    .filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .filter-count {
      color: rgba(212, 163, 95, 0.74);
      font-size: 11px;
      white-space: nowrap;
    }

    .chip-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 40px;
      align-items: center;
    }

    .chip {
      min-height: 36px;
      padding: 8px 15px;
      border-radius: 100px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all 220ms cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .chip:hover {
      color: var(--text-body);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(212, 163, 95, 0.2);
    }

    .chip--active {
      color: var(--accent-primary);
      background: linear-gradient(135deg, rgba(212, 163, 95, 0.14), rgba(212, 163, 95, 0.06));
      border-color: rgba(212, 163, 95, 0.35);
      font-weight: 600;
      box-shadow: 0 0 12px rgba(212, 163, 95, 0.08);
    }

    .chip--small {
      min-height: 30px;
      padding: 6px 11px;
      font-size: 12.5px;
    }

    .chip--ghost {
      color: rgba(212, 163, 95, 0.8);
      border-style: dashed;
      border-color: rgba(212, 163, 95, 0.22);
    }

    .advanced-toggle {
      margin: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.055);
      padding-top: 14px;
    }

    .advanced-toggle summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }

    .advanced-toggle summary::-webkit-details-marker {
      display: none;
    }

    .advanced-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
    }

    .advanced-title::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(212, 163, 95, 0.76);
      box-shadow: 0 0 12px rgba(212, 163, 95, 0.3);
    }

    .advanced-action {
      color: rgba(212, 163, 95, 0.82);
      font-size: 12px;
      font-weight: 600;
      line-height: 22px;
      transition: color 0.16s ease;
    }

    .advanced-toggle summary:hover .advanced-action,
    .advanced-toggle summary:focus-visible .advanced-action {
      color: var(--accent-primary-light);
    }

    .advanced-panel {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .filter-mini {
      min-width: 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      background: rgba(0, 0, 0, 0.1);
    }

    .filter-mini--exclude {
      grid-column: span 1;
    }

    .filter-mini .filter-label {
      margin-bottom: 9px;
      letter-spacing: 0.08em;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .option-grid .chip {
      width: 100%;
      min-width: 0;
      min-height: 30px;
      padding: 6px 7px;
      font-size: 12px;
      text-align: center;
    }

    .tag-input {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.025);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 25px;
      padding: 4px 9px;
      border-radius: 100px;
      color: var(--accent-primary-light);
      background: rgba(212, 163, 95, 0.09);
      border: 1px solid rgba(212, 163, 95, 0.16);
      font-size: 12px;
      white-space: nowrap;
    }

    .tag button {
      width: 14px;
      height: 14px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(243, 234, 217, 0.62);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
    }

    .tag-input input {
      width: 96px;
      min-width: 72px;
      flex: 1 1 72px;
      border: 0;
      outline: 0;
      color: var(--text-body);
      background: transparent;
      font-size: 12.5px;
    }

    .tag-input input::placeholder {
      color: rgba(126, 116, 105, 0.86);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: auto;
      padding-top: 8px;
    }

    .modal-btn {
      min-height: 48px;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 240ms cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
    }

    .modal-btn--primary {
      min-width: 184px;
      background: linear-gradient(135deg, #d4a35f 0%, #c56b47 100%);
      color: var(--text-inverse);
      box-shadow:
        0 4px 16px rgba(212, 163, 95, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.02em;
    }

    .modal-btn--primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 24px rgba(212, 163, 95, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .bolt {
      font-size: 17px;
      line-height: 1;
    }

    @media (max-width: 760px) {
      .modal-overlay { padding: 12px; align-items: flex-start; }
      .modal-box {
        min-height: calc(100vh - 24px);
        padding: 18px 20px 24px;
      }
      .modal-title { margin-left: 0; font-size: 24px; }
      .modal-tabs { align-self: stretch; }
      .tab-btn { flex: 1; min-width: 0; padding-inline: 10px; }
      .basic-grid,
      .advanced-panel {
        grid-template-columns: 1fr;
      }
      .filter-mini--exclude { grid-column: auto; }
      .modal-filters { padding: 18px 16px; }
      .modal-actions { padding-bottom: 4px; }
      .modal-btn--primary { width: 100%; }
    }

    @media (max-width: 420px) {
      .option-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="modal-overlay">
    <section class="modal-box" aria-label="新建项目弹窗预览">
      <button class="modal-close" aria-label="关闭">×</button>

      <div class="modal-title">新建项目</div>

      <nav class="modal-tabs" aria-label="选题来源">
        <button class="tab-btn tab-btn--active">系统推荐</button>
        <button class="tab-btn">事件库</button>
        <button class="tab-btn">自定义选题</button>
      </nav>

      <section class="modal-filters" aria-label="推荐筛选">
        <div class="basic-grid">
          <div class="filter-group filter-group--timeline">
            <div class="filter-label">时代范围</div>
            <div class="chip-row">
              <button class="chip" data-era="all">不限</button>
              <button class="chip" data-era="ancient">先秦至两汉</button>
              <button class="chip chip--active" data-era="medieval">魏晋至唐宋</button>
              <button class="chip" data-era="late_imperial">元明清</button>
            </div>

            <div class="child-filter">
              <div class="filter-head">
                <div class="child-label">历史区间 <span>随时代范围变化</span></div>
                <div class="period-selection" id="periodSelection">已选：三国、两晋、南北朝、隋、唐、五代十国、宋辽夏金</div>
              </div>
              <div class="period-range-scroll" id="periodRangeScroll">
                <div class="period-range" id="periodRange">
                  <div class="period-track-shell">
                    <div class="period-track"></div>
                    <div class="period-track-active"></div>
                    <input class="period-slider period-slider--start" id="periodStart" type="range" min="0" max="6" value="0" aria-label="历史区间起点">
                    <input class="period-slider period-slider--end" id="periodEnd" type="range" min="0" max="6" value="6" aria-label="历史区间终点">
                  </div>
                  <div class="period-marks" id="periodMarks"></div>
                </div>
                <div class="period-empty" id="periodEmpty" hidden>不限历史区间</div>
              </div>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-label">讲述视角</div>
            <div class="chip-row">
              <button class="chip chip--active" data-lens="auto">系统判断</button>
              <button class="chip" data-lens="key_decision">关键决策</button>
              <button class="chip" data-lens="relationship_dynamics">人物博弈</button>
              <button class="chip" data-lens="turning_point">局势转折</button>
              <button class="chip" data-lens="origins_analysis">前因追溯</button>
              <button class="chip" data-lens="aftermath">后果追踪</button>
            </div>
          </div>
        </div>

        <details class="advanced-toggle" open>
          <summary>
            <span class="advanced-title">更多筛选</span>
            <span class="advanced-action" id="advancedAction">收起筛选</span>
          </summary>

          <div class="advanced-panel">
            <div class="filter-mini">
              <div class="filter-label">事件领域</div>
              <div class="option-grid">
                <button class="chip chip--small chip--active" data-domain="">不限</button>
                <button class="chip chip--small" data-domain="political_power">政治权力</button>
                <button class="chip chip--small" data-domain="military_warfare">军事战争</button>
                <button class="chip chip--small" data-domain="institutions_governance">制度治理</button>
                <button class="chip chip--small" data-domain="diplomacy_relations">外交交涉</button>
                <button class="chip chip--small" data-domain="law_justice">法律司法</button>
                <button class="chip chip--small" data-domain="society_livelihood">社会民生</button>
                <button class="chip chip--small" data-domain="thought_culture">思想文化</button>
              </div>
            </div>

            <div class="filter-mini">
              <div class="filter-label">中心行动者</div>
              <div class="option-grid">
                <button class="chip chip--small chip--active" data-actor="">不限</button>
                <button class="chip chip--small" data-actor="ruler">帝王君主</button>
                <button class="chip chip--small" data-actor="court_elite">宫廷权贵</button>
                <button class="chip chip--small" data-actor="civil_official">文官政务</button>
                <button class="chip chip--small" data-actor="military_actor">军事人物</button>
                <button class="chip chip--small" data-actor="intellectual_actor">学者思想家</button>
                <button class="chip chip--small" data-actor="religious_actor">宗教人物</button>
                <button class="chip chip--small" data-actor="civilian">民间人物</button>
                <button class="chip chip--small" data-actor="collective">群体多方</button>
              </div>
            </div>

            <div class="filter-mini filter-mini--exclude">
              <div class="filter-label">排除项</div>
              <div class="tag-input">
                <span class="tag">神话<button aria-label="移除">×</button></span>
                <span class="tag">演义<button aria-label="移除">×</button></span>
                <input placeholder="输入要避开的内容">
              </div>
            </div>
          </div>
        </details>
      </section>

      <div class="modal-actions">
        <button class="modal-btn modal-btn--primary">
          <span class="bolt">⚡</span>
          开始生成选题
        </button>
      </div>
    </section>
  </main>

  <script>
    const periodGroups = {
      ancient: [
        { id: "xia_shang_western_zhou", label: "夏商西周", kind: "period" },
        { id: "spring_autumn", label: "春秋", kind: "period" },
        { id: "warring_states", label: "战国", kind: "period" },
        { id: "qin", label: "秦", kind: "period" },
        { id: "han", label: "两汉", kind: "period" },
      ],
      medieval: [
        { id: "three_kingdoms", label: "三国", kind: "period" },
        { id: "two_jin", label: "两晋", kind: "period" },
        { id: "southern_northern", label: "南北朝", kind: "period" },
        { id: "sui", label: "隋", kind: "period" },
        { id: "tang", label: "唐", kind: "period" },
        { id: "five_dynasties_ten_kingdoms", label: "五代十国", kind: "period" },
        { id: "song_liao_xia_jin", label: "宋辽夏金", kind: "period" },
      ],
      late_imperial: [
        { id: "yuan", label: "元", kind: "period" },
        { id: "ming", label: "明", kind: "period" },
        { id: "qing", label: "清", kind: "period" },
      ],
    };

    const eraButtons = Array.from(document.querySelectorAll("[data-era]"));
    const periodRangeScroll = document.getElementById("periodRangeScroll");
    const periodRange = document.getElementById("periodRange");
    const periodMarks = document.getElementById("periodMarks");
    const periodEmpty = document.getElementById("periodEmpty");
    const periodStart = document.getElementById("periodStart");
    const periodEnd = document.getElementById("periodEnd");
    const periodSelection = document.getElementById("periodSelection");
    const advancedToggle = document.querySelector(".advanced-toggle");
    const advancedAction = document.getElementById("advancedAction");

    let activeEra = "medieval";
    let activePeriods = periodGroups[activeEra];

    function updatePeriodSelection() {
      const startIndex = Number(periodStart.value);
      const endIndex = Number(periodEnd.value);
      const denominator = Math.max(activePeriods.length - 1, 1);
      const selected = activePeriods.slice(startIndex, endIndex + 1);
      const selectedText = selected.map((period) => period.label).join("、");

      periodRange.style.setProperty("--range-left", `${(startIndex / denominator) * 100}%`);
      periodRange.style.setProperty("--range-width", `${((endIndex - startIndex) / denominator) * 100}%`);
      periodSelection.textContent = `已选：${selectedText}`;
      periodSelection.title = selectedText;

      Array.from(periodMarks.children).forEach((mark, index) => {
        mark.classList.toggle("period-mark--active", index >= startIndex && index <= endIndex);
      });
    }

    function renderPeriodRange(era, initialRange) {
      activeEra = era;
      activePeriods = periodGroups[era] ?? [];
      const isUnlimited = activePeriods.length === 0;

      periodRange.hidden = isUnlimited;
      periodEmpty.hidden = !isUnlimited;
      periodSelection.textContent = isUnlimited ? "已选：不限" : "";
      periodSelection.title = "";

      if (isUnlimited) return;

      const lastIndex = activePeriods.length - 1;
      const startIndex = Math.min(initialRange?.[0] ?? 0, lastIndex);
      const endIndex = Math.max(startIndex, Math.min(initialRange?.[1] ?? lastIndex, lastIndex));

      periodRange.style.setProperty("--period-count", activePeriods.length);
      periodRange.style.minWidth = `${Math.max(360, activePeriods.length * 68)}px`;
      periodStart.max = String(lastIndex);
      periodEnd.max = String(lastIndex);
      periodStart.value = String(startIndex);
      periodEnd.value = String(endIndex);
      periodMarks.replaceChildren(...activePeriods.map((period) => {
        const mark = document.createElement("span");
        mark.className = "period-mark";
        mark.textContent = period.label;
        mark.dataset.periodId = period.id;
        mark.dataset.periodKind = period.kind;
        return mark;
      }));

      updatePeriodSelection();
      periodRangeScroll.scrollLeft = 0;
    }

    periodStart.addEventListener("input", () => {
      if (Number(periodStart.value) > Number(periodEnd.value)) {
        periodStart.value = periodEnd.value;
      }
      updatePeriodSelection();
    });

    periodEnd.addEventListener("input", () => {
      if (Number(periodEnd.value) < Number(periodStart.value)) {
        periodEnd.value = periodStart.value;
      }
      updatePeriodSelection();
    });

    function updateAdvancedAction() {
      advancedAction.textContent = advancedToggle.open ? "收起筛选" : "展开筛选";
    }

    advancedToggle.addEventListener("toggle", updateAdvancedAction);
    updateAdvancedAction();

    eraButtons.forEach((button) => {
      button.addEventListener("click", () => {
        eraButtons.forEach((item) => item.classList.remove("chip--active"));
        button.classList.add("chip--active");
        renderPeriodRange(button.dataset.era);
      });
    });

    renderPeriodRange("medieval", [0, 6]);
  </script>
</body>
</html>
