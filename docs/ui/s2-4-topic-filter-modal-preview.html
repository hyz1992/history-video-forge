<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S2-4 推荐筛选弹窗预览</title>
  <style>
    :root {
      --bg-card: #1f1b18;
      --bg-card-soft: #241f1b;
      --bg-page: #05070d;
      --text-heading: #f3ead9;
      --text-body: #d9cbb7;
      --text-secondary: #b8aa98;
      --text-muted: #7e7469;
      --text-inverse: #15100b;
      --accent-primary: #d4a35f;
      --accent-primary-light: #e4bd78;
      --accent-copper: #c56b47;
      --border-default: rgba(212, 163, 95, 0.14);
      --font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(41, 49, 66, 0.24), transparent 34%),
        var(--bg-page);
      color: var(--text-body);
      font-family: var(--font-family);
    }

    button,
    input {
      font: inherit;
    }

    .modal-overlay {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 6, 12, 0.72);
      backdrop-filter: blur(6px);
    }

    .modal-box {
      position: relative;
      width: 960px;
      max-width: 94vw;
      max-height: 90vh;
      min-height: 640px;
      overflow-y: auto;
      background: linear-gradient(180deg, #141c2b 0%, var(--bg-card) 160px);
      border: 1px solid var(--border-default);
      border-radius: 16px;
      box-shadow:
        0 0 0 1px rgba(212, 163, 95, 0.05),
        0 8px 48px rgba(0, 0, 0, 0.55),
        0 2px 12px rgba(0, 0, 0, 0.3);
      padding: 18px 54px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(212, 163, 95, 0.35), transparent);
      border-radius: 0 0 2px 2px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-default);
      border-radius: 50%;
      font-size: 15px;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      transition: all 200ms ease;
    }

    .modal-close:hover {
      color: var(--text-heading);
      background: rgba(212, 163, 95, 0.1);
      border-color: rgba(212, 163, 95, 0.3);
    }

    .modal-title {
      margin-left: -30px;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-heading);
      line-height: 1;
      padding-right: 40px;
    }

    .modal-tabs {
      margin-top: -10px;
      display: inline-flex;
      gap: 2px;
      align-self: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 5px;
      border: 1px solid rgba(212, 163, 95, 0.1);
    }

    .tab-btn {
      min-width: 108px;
      padding: 10px 28px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      position: relative;
    }

    .tab-btn:hover { color: var(--text-body); }

    .tab-btn--active {
      background: linear-gradient(135deg, rgba(212, 163, 95, 0.18), rgba(212, 163, 95, 0.08));
      color: var(--accent-primary);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .modal-filters {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px 24px 18px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(212, 163, 95, 0.08);
      border-radius: 14px;
    }

    .basic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 24px;
    }

    .filter-group {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-group--wide {
      grid-column: 1 / -1;
    }

    .filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .filter-count {
      color: rgba(212, 163, 95, 0.74);
      font-size: 11px;
      white-space: nowrap;
    }

    .chip-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 40px;
      align-items: center;
    }

    .chip {
      min-height: 40px;
      padding: 9px 18px;
      border-radius: 100px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all 220ms cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .chip:hover {
      color: var(--text-body);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(212, 163, 95, 0.2);
    }

    .chip--active {
      color: var(--accent-primary);
      background: linear-gradient(135deg, rgba(212, 163, 95, 0.14), rgba(212, 163, 95, 0.06));
      border-color: rgba(212, 163, 95, 0.35);
      font-weight: 600;
      box-shadow: 0 0 12px rgba(212, 163, 95, 0.08);
    }

    .chip--small {
      min-height: 32px;
      padding: 7px 13px;
      font-size: 12.5px;
    }

    .chip--ghost {
      color: rgba(212, 163, 95, 0.8);
      border-style: dashed;
      border-color: rgba(212, 163, 95, 0.22);
    }

    .advanced-toggle {
      margin: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.055);
      padding-top: 14px;
    }

    .advanced-toggle summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }

    .advanced-toggle summary::-webkit-details-marker {
      display: none;
    }

    .advanced-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
    }

    .advanced-title::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(212, 163, 95, 0.76);
      box-shadow: 0 0 12px rgba(212, 163, 95, 0.3);
    }

    .advanced-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .chevron {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(212, 163, 95, 0.82);
      background: rgba(212, 163, 95, 0.07);
      border: 1px solid rgba(212, 163, 95, 0.12);
      transform: rotate(180deg);
    }

    .advanced-toggle:not([open]) .chevron {
      transform: rotate(0deg);
    }

    .advanced-panel {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
    }

    .filter-mini {
      min-width: 0;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      background: rgba(0, 0, 0, 0.1);
    }

    .filter-mini .filter-label {
      margin-bottom: 9px;
      letter-spacing: 0.08em;
    }

    .tag-input {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.025);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 25px;
      padding: 4px 9px;
      border-radius: 100px;
      color: var(--accent-primary-light);
      background: rgba(212, 163, 95, 0.09);
      border: 1px solid rgba(212, 163, 95, 0.16);
      font-size: 12px;
      white-space: nowrap;
    }

    .tag button {
      width: 14px;
      height: 14px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(243, 234, 217, 0.62);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
    }

    .tag-input input {
      width: 96px;
      min-width: 72px;
      flex: 1 1 72px;
      border: 0;
      outline: 0;
      color: var(--text-body);
      background: transparent;
      font-size: 12.5px;
    }

    .tag-input input::placeholder {
      color: rgba(126, 116, 105, 0.86);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: auto;
      padding-top: 8px;
    }

    .modal-btn {
      min-height: 48px;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 240ms cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
    }

    .modal-btn--primary {
      min-width: 184px;
      background: linear-gradient(135deg, #d4a35f 0%, #c56b47 100%);
      color: var(--text-inverse);
      box-shadow:
        0 4px 16px rgba(212, 163, 95, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.02em;
    }

    .modal-btn--primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 24px rgba(212, 163, 95, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .bolt {
      font-size: 17px;
      line-height: 1;
    }

    @media (max-width: 760px) {
      .modal-overlay { padding: 12px; align-items: flex-start; }
      .modal-box {
        min-height: calc(100vh - 24px);
        padding: 18px 20px 24px;
      }
      .modal-title { margin-left: 0; font-size: 24px; }
      .modal-tabs { align-self: stretch; }
      .tab-btn { flex: 1; min-width: 0; padding-inline: 10px; }
      .basic-grid,
      .advanced-panel {
        grid-template-columns: 1fr;
      }
      .modal-filters { padding: 18px 16px; }
      .advanced-summary { display: none; }
      .modal-actions { padding-bottom: 4px; }
      .modal-btn--primary { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="modal-overlay">
    <section class="modal-box" aria-label="新建项目弹窗预览">
      <button class="modal-close" aria-label="关闭">×</button>

      <div class="modal-title">新建项目</div>

      <nav class="modal-tabs" aria-label="选题来源">
        <button class="tab-btn tab-btn--active">系统推荐</button>
        <button class="tab-btn">事件库</button>
        <button class="tab-btn">自定义选题</button>
      </nav>

      <section class="modal-filters" aria-label="推荐筛选">
        <div class="basic-grid">
          <div class="filter-group">
            <div class="filter-label">时代范围</div>
            <div class="chip-row">
              <button class="chip">先秦至两汉</button>
              <button class="chip chip--active">魏晋至唐宋</button>
              <button class="chip">元明清</button>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-label">叙事取向</div>
            <div class="chip-row">
              <button class="chip chip--active">高张力冲突</button>
              <button class="chip">均衡叙事</button>
              <button class="chip">反常识切入</button>
              <button class="chip">绝境翻盘</button>
            </div>
          </div>

          <div class="filter-group filter-group--wide">
            <div class="filter-head">
              <div class="filter-label">朝代</div>
              <div class="filter-count">最多 3 个</div>
            </div>
            <div class="chip-row">
              <button class="chip chip--active">唐</button>
              <button class="chip">宋</button>
              <button class="chip">明</button>
              <button class="chip">汉</button>
              <button class="chip chip--ghost">+ 输入朝代</button>
            </div>
          </div>
        </div>

        <details class="advanced-toggle" open>
          <summary>
            <span class="advanced-title">更多筛选</span>
            <span class="advanced-summary">
              人物关系、事件类型、主题关注、可信度、排除项
              <span class="chevron">⌄</span>
            </span>
          </summary>

          <div class="advanced-panel">
            <div class="filter-mini">
              <div class="filter-label">人物关系</div>
              <div class="chip-row">
                <button class="chip chip--small chip--active">君臣</button>
                <button class="chip chip--small">父子</button>
                <button class="chip chip--small">兄弟</button>
                <button class="chip chip--small">敌对阵营</button>
              </div>
            </div>

            <div class="filter-mini">
              <div class="filter-label">事件类型</div>
              <div class="chip-row">
                <button class="chip chip--small chip--active">夺位</button>
                <button class="chip chip--small">政变</button>
                <button class="chip chip--small">战争</button>
                <button class="chip chip--small">外交羞辱</button>
                <button class="chip chip--small">冤案</button>
              </div>
            </div>

            <div class="filter-mini">
              <div class="filter-label">主题关注</div>
              <div class="chip-row">
                <button class="chip chip--small chip--active">权力代价</button>
                <button class="chip chip--small">信任崩塌</button>
                <button class="chip chip--small">制度压迫</button>
                <button class="chip chip--small">家族撕裂</button>
              </div>
            </div>

            <div class="filter-mini">
              <div class="filter-label">可信度</div>
              <div class="chip-row">
                <button class="chip chip--small chip--active">高</button>
                <button class="chip chip--small chip--active">中</button>
                <button class="chip chip--small">低</button>
                <button class="chip chip--small">有争议</button>
              </div>
            </div>

            <div class="filter-mini">
              <div class="filter-label">排除项</div>
              <div class="tag-input">
                <span class="tag">神话<button aria-label="移除">×</button></span>
                <span class="tag">演义<button aria-label="移除">×</button></span>
                <input placeholder="输入要避开的内容">
              </div>
            </div>
          </div>
        </details>
      </section>

      <div class="modal-actions">
        <button class="modal-btn modal-btn--primary">
          <span class="bolt">⚡</span>
          开始生成选题
        </button>
      </div>
    </section>
  </main>
</body>
</html>
