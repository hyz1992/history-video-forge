<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的项目 - 简化版 - 历史短视频工坊</title>
<style>
  :root {
    --bg-primary: #0d0d0d;
    --bg-secondary: #171310;
    --bg-panel: #1f1a16;
    --bg-panel-soft: rgba(31, 27, 24, 0.72);
    --bg-elevated: rgba(38, 31, 26, 0.82);
    --bg-hover: rgba(201, 162, 39, 0.075);

    --accent-gold: #c9a227;
    --accent-gold-soft: #dfbd68;
    --accent-copper: #b87333;
    --accent-bronze: #cd7f32;
    --accent-warm: #d4a574;

    --text-primary: #f5f0e8;
    --text-secondary: #a89f94;
    --text-muted: #6b635a;
    --text-dim: #504944;

    --border-color: #3d3632;
    --border-soft: rgba(201, 162, 39, 0.12);
    --border-active: rgba(201, 162, 39, 0.34);

    --glow-gold: rgba(201, 162, 39, 0.28);
    --glow-copper: rgba(184, 115, 51, 0.35);

    --success: #65a77a;
    --success-bg: rgba(101, 167, 122, 0.13);
    --warning: #c9a227;
    --warning-bg: rgba(201, 162, 39, 0.13);
    --danger: #c06454;
    --danger-bg: rgba(192, 100, 84, 0.13);
    --info: #8b98a8;
    --info-bg: rgba(139, 152, 168, 0.13);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;

    --shadow-card: 0 18px 48px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    --shadow-elevated: 0 26px 72px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-width: 1180px;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 18% 16%, rgba(184, 115, 51, 0.16) 0%, transparent 44%),
      radial-gradient(ellipse at 84% 20%, rgba(201, 162, 39, 0.11) 0%, transparent 42%),
      linear-gradient(180deg, #0b0b0a 0%, var(--bg-primary) 38%, #130f0d 100%);
    color: var(--text-primary);
    font-family: "Noto Sans SC", "Inter", "Microsoft YaHei", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.14;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 82%);
    z-index: 0;
  }

  button, input {
    font-family: inherit;
  }

  button {
    border: none;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(18px);
    background: rgba(13, 13, 13, 0.84);
    border-bottom: 1px solid rgba(201, 162, 39, 0.14);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    color: var(--accent-gold);
    display: grid;
    place-items: center;
    filter: drop-shadow(0 0 12px rgba(201, 162, 39, 0.18));
  }

  .brand-mark svg {
    width: 30px;
    height: 30px;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    line-height: 1.15;
  }

  .brand-text strong {
    font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-primary);
  }

  .brand-text span {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .account-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    height: 38px;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, color 0.22s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
  }

  .btn:hover {
    transform: translateY(-1px);
  }

  .btn-ghost {
    background: rgba(255,255,255,0.018);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
  }

  .btn-ghost:hover {
    color: var(--text-primary);
    border-color: rgba(184, 115, 51, 0.72);
    background: var(--bg-panel);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-copper), var(--accent-bronze));
    color: #100c08;
    box-shadow: 0 8px 24px rgba(184, 115, 51, 0.25);
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, var(--accent-gold), var(--accent-copper));
    box-shadow: 0 12px 32px var(--glow-gold);
  }

  .btn-subtle {
    height: 36px;
    padding: 0 15px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid rgba(201, 162, 39, 0.14);
    background: rgba(255,255,255,0.018);
    color: var(--text-secondary);
  }

  .btn-subtle:hover {
    color: var(--text-primary);
    border-color: rgba(201, 162, 39, 0.30);
    background: rgba(201, 162, 39, 0.07);
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 12px;
    display: inline-grid;
    place-items: center;
  }

  .icon-btn svg,
  .btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 1120px;
    margin: 0 auto;
    padding: 106px 0 56px;
  }

  .page-header {
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 28px;
  }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 12px;
  }

  .breadcrumb b {
    color: var(--accent-warm);
    font-weight: 500;
  }

  .page-title {
    font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
    font-size: 42px;
    line-height: 1.16;
    letter-spacing: -0.03em;
    margin-bottom: 10px;
  }

  .page-title em {
    font-style: normal;
    color: var(--accent-gold);
  }

  .page-desc {
    color: var(--text-secondary);
    font-size: 15px;
    max-width: 660px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 4px;
  }

  .workspace-card {
    margin-top: 18px;
    overflow: hidden;
    border-radius: var(--radius-xl);
    border: 1px solid rgba(201, 162, 39, 0.16);
    background:
      radial-gradient(circle at 50% 0%, rgba(201, 162, 39, 0.07), transparent 42%),
      rgba(20, 16, 14, 0.86);
    box-shadow: var(--shadow-elevated);
  }

  .toolbar {
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 1px solid rgba(201, 162, 39, 0.13);
  }

  .toolbar-left {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .search-box {
    position: relative;
    width: 340px;
    flex: 0 0 340px;
  }

  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 40px;
    padding: 0 14px 0 40px;
    border-radius: 10px;
    border: 1px solid rgba(201, 162, 39, 0.13);
    background: rgba(255, 255, 255, 0.025);
    color: var(--text-primary);
    outline: none;
    font-size: 14px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .search-input::placeholder {
    color: var(--text-muted);
  }

  .search-input:focus {
    border-color: rgba(184, 115, 51, 0.78);
    box-shadow: 0 0 0 3px rgba(184, 115, 51, 0.14);
    background: rgba(255, 255, 255, 0.035);
  }

  .filter-pills {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-pill {
    height: 36px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid rgba(201, 162, 39, 0.13);
    background: rgba(255,255,255,0.018);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .filter-pill:hover {
    color: var(--text-primary);
    border-color: rgba(184, 115, 51, 0.65);
    background: rgba(201, 162, 39, 0.06);
  }

  .filter-pill.active {
    background: linear-gradient(135deg, var(--accent-copper), var(--accent-bronze));
    color: #120d09;
    border-color: transparent;
    box-shadow: 0 8px 22px rgba(184, 115, 51, 0.20);
  }

  .filter-count {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    background: rgba(201, 162, 39, 0.13);
    color: var(--accent-gold);
    font-size: 11px;
    line-height: 1;
  }

  .filter-pill.active .filter-count {
    background: rgba(13, 13, 13, 0.18);
    color: #120d09;
  }

  .table-meta {
    color: var(--text-muted);
    font-size: 13px;
    white-space: nowrap;
  }

  .table-wrap {
    max-height: calc(100vh - 360px);
    min-height: 442px;
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-copper) var(--bg-secondary);
  }

  .table-wrap::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  .table-wrap::-webkit-scrollbar-track {
    background: var(--bg-secondary);
  }

  .table-wrap::-webkit-scrollbar-thumb {
    background: var(--accent-copper);
    border-radius: 999px;
  }

  .projects-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .projects-table th {
    position: sticky;
    top: 0;
    z-index: 2;
    height: 50px;
    padding: 0 18px;
    text-align: left;
    background: rgba(26, 22, 20, 0.98);
    border-bottom: 1px solid rgba(201, 162, 39, 0.14);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    backdrop-filter: blur(10px);
  }

  .projects-table th.sortable {
    cursor: pointer;
  }

  .projects-table th.sortable:hover,
  .projects-table th.sorted {
    color: var(--accent-gold);
  }

  .sort-arrow {
    display: inline-block;
    margin-left: 6px;
    color: currentColor;
    opacity: 0.75;
  }

  .projects-table td {
    height: 74px;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(61, 54, 50, 0.72);
    vertical-align: middle;
  }

  .projects-table tbody tr {
    cursor: pointer;
    transition: background 0.16s ease;
  }

  .projects-table tbody tr:hover {
    background: var(--bg-hover);
  }

  .project-cell {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
  }

  .thumb {
    position: relative;
    flex: 0 0 38px;
    width: 38px;
    height: 54px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(201, 162, 39, 0.18);
    background:
      radial-gradient(circle at 54% 28%, rgba(244, 201, 112, 0.36), transparent 28%),
      linear-gradient(180deg, rgba(94,46,23,0.56), rgba(10,8,7,0.82)),
      linear-gradient(135deg, #21150f, #0b0908);
    box-shadow: 0 10px 20px rgba(0,0,0,0.24);
  }

  .thumb::before {
    content: "";
    position: absolute;
    left: 11px;
    right: 11px;
    bottom: 11px;
    height: 19px;
    border-radius: 12px 12px 3px 3px;
    background: #070605;
  }

  .thumb::after {
    content: "";
    position: absolute;
    left: 14px;
    top: 16px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #f3d887;
    box-shadow: 0 0 12px rgba(201, 162, 39, 0.36);
  }

  .project-main {
    min-width: 0;
  }

  .project-title {
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 5px;
  }

  .project-sub {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .mini-sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .dynasty-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(201, 162, 39, 0.19);
    background: rgba(201, 162, 39, 0.08);
    color: var(--accent-warm);
    font-family: "Noto Serif SC", Georgia, serif;
    font-size: 13px;
    font-weight: 600;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 29px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 650;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .status-success {
    background: var(--success-bg);
    border-color: rgba(101, 167, 122, 0.28);
    color: var(--success);
  }

  .status-warning {
    background: var(--warning-bg);
    border-color: rgba(201, 162, 39, 0.28);
    color: var(--warning);
  }

  .status-danger {
    background: var(--danger-bg);
    border-color: rgba(192, 100, 84, 0.30);
    color: var(--danger);
  }

  .status-info {
    background: var(--info-bg);
    border-color: rgba(139, 152, 168, 0.25);
    color: var(--info);
  }

  .status-generating .status-dot {
    animation: pulse-dot 1.3s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.78); }
  }

  .time {
    color: var(--text-secondary);
    font-size: 13px;
    white-space: nowrap;
  }

  .action-cell {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
  }
  .delete-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(192, 100, 84, 0.22);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-grid;
    place-items: center;
    transition: all 0.18s ease;
  }

  .delete-btn:hover {
    color: var(--danger);
    border-color: rgba(192, 100, 84, 0.45);
    background: var(--danger-bg);
  }

  .delete-btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  .footer-line {
    height: 44px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(201, 162, 39, 0.11);
    color: var(--text-muted);
    font-size: 12px;
  }

  .footer-line strong {
    color: var(--accent-warm);
    font-weight: 600;
  }

  .empty-state {
    min-height: 440px;
    padding: 64px 40px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .empty-icon {
    width: 78px;
    height: 78px;
    display: grid;
    place-items: center;
    margin-bottom: 22px;
    border-radius: 50%;
    border: 1px solid rgba(201, 162, 39, 0.22);
    background: rgba(201, 162, 39, 0.08);
    color: var(--accent-gold);
  }

  .empty-icon svg {
    width: 34px;
    height: 34px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
  }

  .empty-state h2 {
    font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
    font-size: 24px;
    margin-bottom: 8px;
  }

  .empty-state p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 22px;
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" onclick="handleGoHome()">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <path d="M8 12.5C8 10.6 9.6 9 11.5 9h9c1.9 0 3.5 1.6 3.5 3.5v7.2c0 2.2-1.8 4-4 4h-8c-2.2 0-4-1.8-4-4v-7.2Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M10 9.2C10.7 6.9 12.9 5.5 16 5.5s5.3 1.4 6 3.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M15 13.1c0-.8.9-1.3 1.6-.9l4.1 2.4c.7.4.7 1.4 0 1.8l-4.1 2.4c-.7.4-1.6-.1-1.6-.9v-4.8Z" fill="currentColor"/>
          <path d="M11.2 14h1.7M11.2 17.5h1.7M19.1 14h1.7M19.1 17.5h1.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M16 4v-2M12.2 6.2 10.6 4.5M19.8 6.2l1.6-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>历史短视频工坊</strong>
        <span>History Video Forge</span>
      </span>
    </a>

    <div class="topbar-right">
      <div class="account-actions">
        <button class="btn btn-subtle">我的</button>
        <button class="btn btn-subtle icon-btn" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.04.04a2 2 0 1 1-2.83 2.83l-.04-.04a1.7 1.7 0 0 0-1.86-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.86.34l-.04.04a2 2 0 1 1-2.83-2.83l.04-.04A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.04A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.34-1.86l-.04-.04A2 2 0 1 1 7.05 3.27l.04.04A1.7 1.7 0 0 0 8.95 3a1.7 1.7 0 0 0 1.03-1.56V1a2 2 0 1 1 4 0v.44A1.7 1.7 0 0 0 15.01 3a1.7 1.7 0 0 0 1.86-.34l.04-.04a2 2 0 1 1 2.83 2.83l-.04.04A1.7 1.7 0 0 0 19.4 8a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.04A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="page-header">
      <div>
        <div class="breadcrumb">
          <span>工坊控制台</span>
          <span>›</span>
          <b>我的项目</b>
        </div>
        <h1 class="page-title">我的<em>项目</em></h1>
        <p class="page-desc">管理你创建的历史短视频项目，查看当前状态，按名称、朝代或更新时间快速找到项目。需要创建内容时，使用页面右侧的新建项目入口。</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="handleCreateProject()">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          新建项目
        </button>
      </div>
    </section>

    <section class="workspace-card">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input id="searchInput" class="search-input" type="text" placeholder="搜索项目名称、朝代或状态..." oninput="handleSearch(this.value)" />
          </div>
          <div class="filter-pills" id="filters"></div>
        </div>
        <div class="table-meta" id="tableMeta"></div>
      </div>

      <div class="table-wrap" id="tableWrap">
        <table class="projects-table">
          <colgroup>
            <col style="width: 45%;" />
            <col style="width: 12%;" />
            <col style="width: 18%;" />
            <col style="width: 17%;" />
            <col style="width: 8%;" />
          </colgroup>
          <thead>
            <tr>
              <th class="sortable" data-sort="name" onclick="sortTable('name')">项目名称</th>
              <th class="sortable" data-sort="dynasty" onclick="sortTable('dynasty')">朝代</th>
              <th>状态</th>
              <th class="sortable sorted" data-sort="time" onclick="sortTable('time')">更新时间 <span class="sort-arrow">↓</span></th>
              <th style="text-align:right;">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14h6"/></svg>
        </div>
        <h2>没有找到项目</h2>
        <p>可以调整筛选条件，或创建一个新的历史视频项目。</p>
        <button class="btn btn-primary" onclick="handleCreateProject()">新建项目</button>
      </div>

      <div class="footer-line">
        <span id="footerSummary">共 0 个项目</span>
        <span>默认按 <strong>更新时间</strong> 倒序排列</span>
      </div>
    </section>
  </main>
<script>
  const projects = [
    { id: 'p001', name: '大唐盛世：安史之乱背后的真相', dynasty: '唐朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-22T10:30:00', updatedAtFormatted: '2026-06-22 10:30', duration: '00:58', topicType: '战争转折' },
    { id: 'p002', name: '三国风云：诸葛亮的最后一战', dynasty: '三国', status: 'assets_ready', statusLabel: '资产已就绪', updatedAt: '2026-06-21T15:45:00', updatedAtFormatted: '2026-06-21 15:45', duration: '01:04', topicType: '人物命运' },
    { id: 'p003', name: '明朝那些事儿：锦衣卫的兴衰', dynasty: '明朝', status: 'script_generating', statusLabel: '文案生成中', updatedAt: '2026-06-21T09:20:00', updatedAtFormatted: '2026-06-21 09:20', duration: '预计 60s', topicType: '权力机构' },
    { id: 'p004', name: '秦时明月：秦始皇陵的秘密', dynasty: '秦朝', status: 'storyboard_ready', statusLabel: '分镜已就绪', updatedAt: '2026-06-20T18:00:00', updatedAtFormatted: '2026-06-20 18:00', duration: '预计 75s', topicType: '历史谜团' },
    { id: 'p005', name: '宋末崖山：十万军民的最后一跃', dynasty: '宋朝', status: 'render_failed', statusLabel: '渲染失败', updatedAt: '2026-06-19T22:15:00', updatedAtFormatted: '2026-06-19 22:15', duration: '01:12', topicType: '王朝终局' },
    { id: 'p006', name: '甲午战争：北洋水师的覆灭', dynasty: '清朝', status: 'composition_ready', statusLabel: '合成已就绪', updatedAt: '2026-06-18T14:30:00', updatedAtFormatted: '2026-06-18 14:30', duration: '预计 68s', topicType: '战争转折' },
    { id: 'p007', name: '汉武帝：丝绸之路的开辟', dynasty: '汉朝', status: 'topic_candidates_ready', statusLabel: '待确认主题', updatedAt: '2026-06-17T11:00:00', updatedAtFormatted: '2026-06-17 11:00', duration: '未定', topicType: '文明交流' },
    { id: 'p008', name: '唐太宗：玄武门之变', dynasty: '唐朝', status: 'script_ready', statusLabel: '文案已就绪', updatedAt: '2026-06-16T16:20:00', updatedAtFormatted: '2026-06-16 16:20', duration: '预计 60s', topicType: '宫廷权谋' },
    { id: 'p009', name: '清康熙：九子夺嫡', dynasty: '清朝', status: 'asset_plan_ready', statusLabel: '资产规划已就绪', updatedAt: '2026-06-15T08:45:00', updatedAtFormatted: '2026-06-15 08:45', duration: '预计 70s', topicType: '宫廷权谋' },
    { id: 'p010', name: '五代十国：乱世枭雄', dynasty: '五代', status: 'assets_generating', statusLabel: '资产生成中', updatedAt: '2026-06-14T13:30:00', updatedAtFormatted: '2026-06-14 13:30', duration: '预计 55s', topicType: '乱世人物' },
    { id: 'p011', name: '元朝兴衰：蒙古帝国的崛起', dynasty: '元朝', status: 'render_ready', statusLabel: '渲染已就绪', updatedAt: '2026-06-13T20:00:00', updatedAtFormatted: '2026-06-13 20:00', duration: '预计 65s', topicType: '帝国崛起' },
    { id: 'p012', name: '晚清变局：洋务运动的失败', dynasty: '清朝', status: 'script_reviewing', statusLabel: '文案审阅中', updatedAt: '2026-06-12T09:15:00', updatedAtFormatted: '2026-06-12 09:15', duration: '预计 62s', topicType: '改革失败' },
    { id: 'p013', name: '春秋战国：百家争鸣', dynasty: '春秋', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-11T17:40:00', updatedAtFormatted: '2026-06-11 17:40', duration: '01:06', topicType: '思想交锋' },
    { id: 'p014', name: '北宋靖康：金兵南下', dynasty: '宋朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-10T12:00:00', updatedAtFormatted: '2026-06-10 12:00', duration: '00:57', topicType: '王朝危机' },
    { id: 'p015', name: '南明悲歌：永历帝的最后岁月', dynasty: '明朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-09T15:25:00', updatedAtFormatted: '2026-06-09 15:25', duration: '01:10', topicType: '王朝终局' },
    { id: 'p016', name: '太平天国：洪秀全的理想国', dynasty: '清朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-08T10:50:00', updatedAtFormatted: '2026-06-08 10:50', duration: '01:01', topicType: '民变风云' },
    { id: 'p017', name: '辛亥革命：推翻帝制', dynasty: '清朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-07T08:30:00', updatedAtFormatted: '2026-06-07 08:30', duration: '00:59', topicType: '制度转折' },
    { id: 'p018', name: '民国风云：军阀混战时代', dynasty: '民国', status: 'topic_pending', statusLabel: '待生成选题', updatedAt: '2026-06-06T14:00:00', updatedAtFormatted: '2026-06-06 14:00', duration: '未定', topicType: '乱世格局' },
  ];

  let currentFilter = 'all';
  let searchQuery = '';
  let sortBy = 'time';
  let sortOrder = 'desc';
  let activeMenuId = null;

  const FILTERS = [
    { key: 'all', label: '全部' },
    { key: 'todo', label: '需处理' },
    { key: 'generating', label: '生成中' },
    { key: 'completed', label: '已完成' },
    { key: 'failed', label: '失败' },
  ];

  function isCompletedStatus(status) {
    return status === 'render_completed';
  }

  function isFailedStatus(status) {
    return ['script_failed', 'asset_plan_failed', 'render_failed', 'assets_blocked'].includes(status);
  }

  function isGeneratingStatus(status) {
    return ['script_generating', 'storyboard_generating', 'asset_plan_generating', 'assets_generating', 'render_rendering'].includes(status);
  }

  function isTodoStatus(status) {
    return [
      'assets_ready',
      'storyboard_ready',
      'composition_ready',
      'topic_candidates_ready',
      'script_ready',
      'asset_plan_ready',
      'render_ready',
      'script_reviewing',
      'topic_pending',
      'render_failed'
    ].includes(status);
  }

  function getStatusClass(status) {
    if (isCompletedStatus(status)) return 'status-success';
    if (isFailedStatus(status)) return 'status-danger';
    if (isGeneratingStatus(status)) return 'status-warning';
    if (['render_ready', 'assets_ready', 'composition_ready', 'script_ready', 'storyboard_ready', 'asset_plan_ready', 'topic_candidates_ready', 'script_reviewing'].includes(status)) return 'status-warning';
    return 'status-info';
  }
  function matchesFilter(project, filter) {
    if (filter === 'all') return true;
    if (filter === 'todo') return isTodoStatus(project.status);
    if (filter === 'generating') return isGeneratingStatus(project.status);
    if (filter === 'completed') return isCompletedStatus(project.status);
    if (filter === 'failed') return isFailedStatus(project.status);
    return true;
  }

  function getCounts() {
    return {
      all: projects.length,
      todo: projects.filter(p => isTodoStatus(p.status)).length,
      generating: projects.filter(p => isGeneratingStatus(p.status)).length,
      completed: projects.filter(p => isCompletedStatus(p.status)).length,
      failed: projects.filter(p => isFailedStatus(p.status)).length,
    };
  }
  function renderFilters() {
    const counts = getCounts();
    const filters = document.getElementById('filters');
    filters.innerHTML = FILTERS.map(f => `
      <button class="filter-pill ${currentFilter === f.key ? 'active' : ''}" onclick="setFilter('${f.key}')">
        ${f.label}<span class="filter-count">${counts[f.key]}</span>
      </button>
    `).join('');
  }

  function getFilteredProjects() {
    const query = searchQuery.trim().toLowerCase();
    let filtered = projects.filter(p => {
      const content = `${p.name} ${p.dynasty} ${p.statusLabel} ${p.topicType}`.toLowerCase();
      return (!query || content.includes(query)) && matchesFilter(p, currentFilter);
    });

    filtered.sort((a, b) => {
      let result = 0;
      if (sortBy === 'time') result = new Date(a.updatedAt) - new Date(b.updatedAt);
      if (sortBy === 'name') result = a.name.localeCompare(b.name);
      if (sortBy === 'dynasty') result = a.dynasty.localeCompare(b.dynasty);
      return sortOrder === 'desc' ? -result : result;
    });

    return filtered;
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');
    const tableWrap = document.getElementById('tableWrap');
    const tableMeta = document.getElementById('tableMeta');
    const footerSummary = document.getElementById('footerSummary');

    const filtered = getFilteredProjects();
    tableMeta.textContent = `当前显示 ${filtered.length} / ${projects.length}`;
    footerSummary.innerHTML = `共 <strong>${filtered.length}</strong> 个项目`;

    if (filtered.length === 0) {
      tableWrap.style.display = 'none';
      empty.style.display = 'flex';
      tbody.innerHTML = '';
      return;
    }

    tableWrap.style.display = 'block';
    empty.style.display = 'none';

    tbody.innerHTML = filtered.map(p => {
      const statusClass = getStatusClass(p.status);
      const generatingClass = isGeneratingStatus(p.status) ? 'status-generating' : '';
      return `
        <tr onclick="openProject('${p.id}')">
          <td>
            <div class="project-cell">
              <div class="thumb" aria-hidden="true"></div>
              <div class="project-main">
                <div class="project-title">${p.name}</div>
                <div class="project-sub">
                  <span>${p.topicType}</span>
                  <span class="mini-sep"></span>
                  <span>9:16</span>
                  <span class="mini-sep"></span>
                  <span>${p.duration}</span>
                </div>
              </div>
            </div>
          </td>
          <td><span class="dynasty-tag">${p.dynasty}</span></td>
          <td>
            <span class="status-badge ${statusClass} ${generatingClass}">
              <span class="status-dot"></span>${p.statusLabel}
            </span>
          </td>
          <td><span class="time">${p.updatedAtFormatted}</span></td>
          <td>
            <div class="action-cell">
              <button class="delete-btn" onclick="event.stopPropagation(); deleteProject('${p.id}')" title="删除项目" aria-label="删除项目">
                <svg viewBox="0 0 24 24">
                  <path d="M3 6h18"></path>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                  <path d="M19 6l-1 14c-.1 1.1-1 2-2.1 2H8.1C7 22 6.1 21.1 6 20L5 6"></path>
                  <path d="M10 11v6"></path>
                  <path d="M14 11v6"></path>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function renderSortHeaders() {
    document.querySelectorAll('th.sortable').forEach(th => {
      th.classList.toggle('sorted', th.dataset.sort === sortBy);
      const old = th.querySelector('.sort-arrow');
      if (old) old.remove();
      if (th.dataset.sort === sortBy) {
        const span = document.createElement('span');
        span.className = 'sort-arrow';
        span.textContent = sortOrder === 'desc' ? '↓' : '↑';
        th.appendChild(span);
      }
    });
  }

  function renderAll() {
    renderFilters();
    renderSortHeaders();
    renderTable();
  }

  function setFilter(filter) {
    currentFilter = filter;
    renderAll();
  }

  function sortTable(column) {
    if (sortBy === column) {
      sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
    } else {
      sortBy = column;
      sortOrder = 'desc';
    }
    renderAll();
  }

  function handleSearch(value) {
    searchQuery = value;
    renderAll();
  }

  function handleCreateProject() {
    alert('创建新项目');
  }

  function handleGoHome() {
    window.location.href = 'preview-landing.html';
  }

  function openProject(id) {
    console.log('Open project:', id);
    alert('打开项目：' + id);
  }
  function deleteProject(id) {
    const project = projects.find(p => p.id === id);
    const name = project ? project.name : id;
    alert('删除项目：' + name);
  }

  renderAll();
</script>
</body>
</html>
