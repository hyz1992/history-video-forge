<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的项目 - 预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 暗色主题 - 与落地页一致 */
      --bg-primary: #0d0d0d;
      --bg-secondary: #1a1614;
      --bg-card: #1f1b18;
      --bg-panel: #1a1614;
      --bg-hover: rgba(201, 162, 39, 0.08);
      --accent-gold: #c9a227;
      --accent-copper: #b87333;
      --accent-bronze: #cd7f32;
      --accent-warm: #d4a574;
      --text-primary: #f5f0e8;
      --text-secondary: #a89f94;
      --text-muted: #6b635a;
      --text-body: #f5f0e8;
      --border-color: #3d3632;
      --border-active: rgba(201, 162, 39, 0.32);
      --glow-gold: rgba(201, 162, 39, 0.3);
      --glow-copper: rgba(184, 115, 51, 0.4);
      --color-success: #4a9d6b;
      --color-warning: #c9a227;
      --color-danger: #a63d2f;
      --color-info: #4a6fa5;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-elevated: 0 8px 24px rgba(0,0,0,0.4);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    button {
      font-family: inherit;
      font-size: inherit;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Sans SC", "Inter", sans-serif;
      background: var(--bg-primary);
      color: var(--text-body);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ TOP BAR ============ */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 72px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(16px);
      background: rgba(13, 13, 13, 0.85);
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      text-decoration: none;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .brand-mark svg {
      width: 22px;
      height: 22px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0;
      line-height: 1.2;
    }

    .brand-text strong {
      font-size: 36px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: "Noto Serif SC", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
    }

    .account-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .account-btn {
      height: 36px;
      padding: 0 15px;
      border-radius: 12px;
      font-size: 13px;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      cursor: pointer;
      transition: color 0.22s ease, border-color 0.22s ease, background 0.22s ease, transform 0.22s ease;
      border: 1px solid rgba(201, 162, 39, 0.14);
      background: rgba(255, 255, 255, 0.018);
      color: var(--text-secondary);
    }

    .account-btn:hover {
      color: var(--text-primary);
      border-color: rgba(201, 162, 39, 0.30);
      background: rgba(201, 162, 39, 0.07);
      transform: translateY(-1px);
    }

    .user-btn {
      height: 36px;
      padding: 0 15px;
      font-size: 13px;
    }

    .settings-btn {
      width: 36px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    .settings-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .settings-btn:hover svg {
      stroke: var(--accent-gold);
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .btn-ghost:hover {
      color: var(--text-primary);
      border-color: var(--accent-copper);
      background: var(--bg-card);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-copper), var(--accent-bronze));
      color: var(--bg-primary);
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(184, 115, 51, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-copper));
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--glow-gold);
    }

    /* 背景光晕效果 - 与落地页一致 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, var(--glow-copper) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, var(--glow-gold) 0%, transparent 50%);
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Page Layout ── */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 104px 40px 48px;
      position: relative;
      z-index: 1;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 320px;
      min-width: 200px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      color: var(--text-body);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-copper);
      box-shadow: 0 0 0 3px rgba(184, 115, 51, 0.15);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ── Filter Pills ── */
    .filter-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-pill {
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-pill:hover {
      border-color: var(--accent-copper);
      color: var(--text-primary);
    }

    .filter-pill.active {
      background: linear-gradient(135deg, var(--accent-copper), var(--accent-bronze));
      border-color: transparent;
      color: var(--bg-primary);
    }

    .filter-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      margin-left: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .filter-pill:not(.active) .filter-count {
      background: rgba(201, 162, 39, 0.15);
      color: var(--accent-gold);
    }

    /* ── Stats Bar ── */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-family: Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: "Inter", sans-serif;
    }

    .stat-divider {
      width: 1px;
      height: 32px;
      background: var(--border-color);
    }

    /* ── Table Container ── */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    /* 虚拟列表容器 - 固定高度显示13条 */
    .table-scroll-wrapper {
      max-height: calc(13 * 52px + 48px); /* 13行 + 表头 */
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-copper) var(--bg-secondary);
      scrollbar-gutter: stable;
      padding-right: 12px;
    }

    .table-scroll-wrapper::-webkit-scrollbar {
      width: 8px;
      margin-right: -12px;
    }

    .table-scroll-wrapper::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 4px;
    }

    .table-scroll-wrapper::-webkit-scrollbar-thumb {
      background: var(--accent-copper);
      border-radius: 4px;
    }

    .table-scroll-wrapper::-webkit-scrollbar-thumb:hover {
      background: var(--accent-gold);
    }

    /* ── Table ── */
    .projects-table {
      width: 100%;
      border-collapse: collapse;
    }

    .projects-table th {
      padding: 14px 18px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      color: var(--text-secondary);
      text-align: left;
      letter-spacing: 0.02em;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .projects-table th.sortable {
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .projects-table th.sortable:hover {
      color: var(--accent-gold);
    }

    .projects-table th.sorted {
      color: var(--accent-gold);
    }

    .projects-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
      color: var(--text-body);
      vertical-align: middle;
    }

    .projects-table tbody tr {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .projects-table tbody tr:hover {
      background: var(--bg-hover);
    }

    .projects-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── Project Name ── */
    .project-name-text {
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Dynasty Tag ── */
    .dynasty-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: rgba(201, 162, 39, 0.1);
      border: 1px solid rgba(201, 162, 39, 0.2);
      border-radius: 100px;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--accent-gold);
      font-family: "Noto Serif SC", Georgia, serif;
    }

    /* ── Status Badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: "Inter", "Noto Sans SC", sans-serif;
    }

    .status-badge .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.status-success {
      background: rgba(74, 157, 107, 0.15);
      border: 1px solid rgba(74, 157, 107, 0.3);
      color: #4a9d6b;
    }

    .status-badge.status-warning {
      background: rgba(201, 162, 39, 0.15);
      border: 1px solid rgba(201, 162, 39, 0.3);
      color: var(--accent-gold);
    }

    .status-badge.status-danger {
      background: rgba(166, 61, 47, 0.15);
      border: 1px solid rgba(166, 61, 47, 0.3);
      color: #a63d2f;
    }

    .status-badge.status-info {
      background: rgba(74, 111, 165, 0.15);
      border: 1px solid rgba(74, 111, 165, 0.3);
      color: #4a6fa5;
    }

    .status-badge.status-generating .status-dot {
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Time ── */
    .project-time {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-family: "Inter", sans-serif;
    }

    /* ── Actions ── */
    .action-cell {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: var(--bg-hover);
      border-color: var(--accent-copper);
      color: var(--accent-gold);
    }

    .btn-icon.danger:hover {
      background: rgba(166, 61, 47, 0.15);
      border-color: #a63d2f;
      color: #a63d2f;
    }

    .btn-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ── Delete Confirmation (Inline) ── */
    .delete-confirm {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-confirm {
      padding: 4px 10px;
      background: #a63d2f;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-confirm:hover {
      background: #8b3328;
    }

    .btn-cancel-inline {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-cancel-inline:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(201, 162, 39, 0.1);
      border: 1px solid rgba(201, 162, 39, 0.2);
      border-radius: 50%;
      color: var(--accent-gold);
      margin-bottom: 24px;
    }

    .empty-icon svg {
      width: 36px;
      height: 36px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    .empty-title {
      font-family: "Noto Serif SC", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
      max-width: 320px;
    }

    /* ── Scroll Indicator ── */
    .scroll-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: "Inter", sans-serif;
    }

    .scroll-indicator svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page {
        padding: 100px 20px 32px;
      }

      .topbar {
        padding: 14px 1rem;
        flex-wrap: wrap;
        gap: 12px;
      }

      .topbar-right {
        flex-wrap: wrap;
        gap: 8px;
      }

      .brand-text strong {
        font-size: 24px;
      }

      .brand-text span {
        display: none;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .toolbar-left {
        flex-direction: column;
        gap: 10px;
      }

      .search-box {
        max-width: none;
        min-width: auto;
      }

      .filter-pills {
        flex-wrap: wrap;
      }

      .projects-table th,
      .projects-table td {
        padding: 10px 12px;
      }

      .table-scroll-wrapper {
        max-height: calc(13 * 48px + 44px);
      }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand" onclick="handleGoHome()" style="cursor:pointer;">
      <span class="brand-text">
        <strong>我的项目</strong>
      </span>
    </div>
    <div class="topbar-right">
      <div class="topbar-actions">
        <button class="btn btn-ghost" onclick="handleGoHome()">首页</button>
        <button class="btn btn-primary" onclick="handleCreateProject()">新建项目</button>
      </div>
      <div class="topbar-divider" aria-hidden="true"></div>
      <div class="account-actions">
        <button class="account-btn user-btn">我的</button>
        <button class="account-btn settings-btn" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.04.04a2 2 0 1 1-2.83 2.83l-.04-.04a1.7 1.7 0 0 0-1.86-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.86.34l-.04.04a2 2 0 1 1-2.83-2.83l.04-.04a1.7 1.7 0 0 0-.34-1.86 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.04A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.34-1.86l-.04-.04a2 2 0 1 1 2.83-2.83l.04.04A1.7 1.7 0 0 0 8.95 3a1.7 1.7 0 0 0 1.03-1.56V1a2 2 0 1 1 4 0v.44A1.7 1.7 0 0 0 15.01 3a1.7 1.7 0 0 0 1.86-.34l.04-.04a2 2 0 1 1 2.83 2.83l-.04.04A1.7 1.7 0 0 0 19.4 8a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.04A1.7 1.7 0 0 0 19.4 15z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="page">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" placeholder="搜索项目名称..." oninput="handleSearch(this.value)">
        </div>
        <div class="filter-pills">
          <button class="filter-pill active" onclick="setFilter('all')">
            全部 <span class="filter-count" id="count-all">18</span>
          </button>
          <button class="filter-pill" onclick="setFilter('active')">
            进行中 <span class="filter-count" id="count-active">12</span>
          </button>
          <button class="filter-pill" onclick="setFilter('completed')">
            已完成 <span class="filter-count" id="count-completed">6</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Table Container -->
    <div class="table-container">
      <div class="table-scroll-wrapper" id="tableScrollWrapper">
        <table class="projects-table" id="projectsTable">
          <thead>
            <tr>
              <th class="sortable sorted" onclick="sortTable('name')">项目名称</th>
              <th class="sortable" onclick="sortTable('dynasty')">朝代</th>
              <th>状态</th>
              <th class="sortable" onclick="sortTable('time')">更新时间</th>
              <th style="width: 100px; text-align: right;">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Rows rendered by JS -->
          </tbody>
        </table>
      </div>
      <!-- Scroll Indicator -->
      <div class="scroll-indicator" id="scrollIndicator" style="display: none;">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="7 13 12 18 17 13"></polyline>
          <polyline points="7 6 12 11 17 6"></polyline>
        </svg>
        <span id="scrollText">向下滚动查看更多项目</span>
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="11" x2="12" y2="17"></line>
            <line x1="9" y1="14" x2="15" y2="14"></line>
          </svg>
        </div>
        <h2 class="empty-title">还没有任何项目</h2>
        <p class="empty-desc">开始你的第一个历史视频创作之旅吧</p>
        <button class="btn btn-primary" onclick="handleCreateProject()">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          创建第一个项目
        </button>
      </div>
    </div>
  </div>

  <script>
    // Mock Data - 18条数据用于测试滚动
    const projects = [
      { id: 'p001', name: '大唐盛世：安史之乱背后的真相', dynasty: '唐朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-22T10:30:00', updatedAtFormatted: '2026-06-22 10:30' },
      { id: 'p002', name: '三国风云：诸葛亮的最后一战', dynasty: '三国', status: 'assets_ready', statusLabel: '资产已就绪', updatedAt: '2026-06-21T15:45:00', updatedAtFormatted: '2026-06-21 15:45' },
      { id: 'p003', name: '明朝那些事儿：锦衣卫的兴衰', dynasty: '明朝', status: 'script_generating', statusLabel: '文案生成中', updatedAt: '2026-06-21T09:20:00', updatedAtFormatted: '2026-06-21 09:20' },
      { id: 'p004', name: '秦时明月：秦始皇陵的秘密', dynasty: '秦朝', status: 'storyboard_ready', statusLabel: '分镜已就绪', updatedAt: '2026-06-20T18:00:00', updatedAtFormatted: '2026-06-20 18:00' },
      { id: 'p005', name: '宋末崖山：十万军民的最后一跃', dynasty: '宋朝', status: 'render_failed', statusLabel: '渲染失败', updatedAt: '2026-06-19T22:15:00', updatedAtFormatted: '2026-06-19 22:15' },
      { id: 'p006', name: '甲午战争：北洋水师的覆灭', dynasty: '清朝', status: 'composition_ready', statusLabel: '合成已就绪', updatedAt: '2026-06-18T14:30:00', updatedAtFormatted: '2026-06-18 14:30' },
      { id: 'p007', name: '汉武帝：丝绸之路的开辟', dynasty: '汉朝', status: 'topic_candidates_ready', statusLabel: '待确认主题', updatedAt: '2026-06-17T11:00:00', updatedAtFormatted: '2026-06-17 11:00' },
      { id: 'p008', name: '唐太宗：玄武门之变', dynasty: '唐朝', status: 'script_ready', statusLabel: '文案已就绪', updatedAt: '2026-06-16T16:20:00', updatedAtFormatted: '2026-06-16 16:20' },
      { id: 'p009', name: '清康熙：九子夺嫡', dynasty: '清朝', status: 'asset_plan_ready', statusLabel: '资产规划已就绪', updatedAt: '2026-06-15T08:45:00', updatedAtFormatted: '2026-06-15 08:45' },
      { id: 'p010', name: '五代十国：乱世枭雄', dynasty: '五代', status: 'assets_generating', statusLabel: '资产生成中', updatedAt: '2026-06-14T13:30:00', updatedAtFormatted: '2026-06-14 13:30' },
      { id: 'p011', name: '元朝兴衰：蒙古帝国的崛起', dynasty: '元朝', status: 'render_ready', statusLabel: '渲染已就绪', updatedAt: '2026-06-13T20:00:00', updatedAtFormatted: '2026-06-13 20:00' },
      { id: 'p012', name: '晚清变局：洋务运动的失败', dynasty: '清朝', status: 'script_reviewing', statusLabel: '文案审阅中', updatedAt: '2026-06-12T09:15:00', updatedAtFormatted: '2026-06-12 09:15' },
      { id: 'p013', name: '春秋战国：百家争鸣', dynasty: '春秋', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-11T17:40:00', updatedAtFormatted: '2026-06-11 17:40' },
      { id: 'p014', name: '北宋靖康：金兵南下', dynasty: '宋朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-10T12:00:00', updatedAtFormatted: '2026-06-10 12:00' },
      { id: 'p015', name: '南明悲歌：永历帝的最后岁月', dynasty: '明朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-09T15:25:00', updatedAtFormatted: '2026-06-09 15:25' },
      { id: 'p016', name: '太平天国：洪秀全的理想国', dynasty: '清朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-08T10:50:00', updatedAtFormatted: '2026-06-08 10:50' },
      { id: 'p017', name: '辛亥革命：推翻帝制', dynasty: '清朝', status: 'render_completed', statusLabel: '渲染完成', updatedAt: '2026-06-07T08:30:00', updatedAtFormatted: '2026-06-07 08:30' },
      { id: 'p018', name: '民国风云：军阀混战时代', dynasty: '民国', status: 'topic_pending', statusLabel: '待生成选题', updatedAt: '2026-06-06T14:00:00', updatedAtFormatted: '2026-06-06 14:00' },
    ];

    let currentFilter = 'all';
    let searchQuery = '';
    let deleteTargetId = null;
    let sortBy = 'time';
    let sortOrder = 'desc';

    function getStatusClass(status) {
      if (['render_completed', 'script_ready', 'storyboard_ready', 'asset_plan_ready', 'assets_ready', 'composition_ready'].includes(status)) {
        return 'status-success';
      }
      if (['script_generating', 'script_reviewing', 'storyboard_generating', 'asset_plan_generating', 'assets_generating', 'render_ready', 'assets_partial', 'topic_candidates_ready'].includes(status)) {
        return 'status-warning';
      }
      if (['script_failed', 'asset_plan_failed', 'render_failed', 'assets_blocked'].includes(status)) {
        return 'status-danger';
      }
      return 'status-info';
    }

    function isGeneratingStatus(status) {
      return ['script_generating', 'storyboard_generating', 'asset_plan_generating', 'assets_generating', 'render_rendering'].includes(status);
    }

    function isCompletedStatus(status) {
      return status === 'render_completed' || status === 'render_ready';
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');
      const tableScrollWrapper = document.getElementById('tableScrollWrapper');
      const scrollIndicator = document.getElementById('scrollIndicator');

      let filtered = projects.filter(p => {
        const matchesSearch = searchQuery === '' || p.name.toLowerCase().includes(searchQuery.toLowerCase());
        let matchesFilter = true;
        if (currentFilter === 'active') {
          matchesFilter = !isCompletedStatus(p.status);
        } else if (currentFilter === 'completed') {
          matchesFilter = isCompletedStatus(p.status);
        }
        return matchesSearch && matchesFilter;
      });

      // Sort
      filtered.sort((a, b) => {
        if (sortBy === 'time') {
          return sortOrder === 'desc' 
            ? new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime()
            : new Date(a.updatedAt).getTime() - new Date(b.updatedAt).getTime();
        } else if (sortBy === 'name') {
          return sortOrder === 'desc' 
            ? b.name.localeCompare(a.name)
            : a.name.localeCompare(b.name);
        } else if (sortBy === 'dynasty') {
          return sortOrder === 'desc' 
            ? b.dynasty.localeCompare(a.dynasty)
            : a.dynasty.localeCompare(b.dynasty);
        }
        return 0;
      });

      // Update counts
      const totalCount = projects.length;
      const activeCount = projects.filter(p => !isCompletedStatus(p.status)).length;
      const completedCount = projects.filter(p => isCompletedStatus(p.status)).length;
      
      document.getElementById('count-all').textContent = totalCount;
      document.getElementById('count-active').textContent = activeCount;
      document.getElementById('count-completed').textContent = completedCount;

      if (filtered.length === 0) {
        tableScrollWrapper.style.display = 'none';
        scrollIndicator.style.display = 'none';
        emptyState.style.display = 'flex';
        return;
      }

      tableScrollWrapper.style.display = 'block';
      emptyState.style.display = 'none';

      // Show scroll indicator if more than 13 items
      if (filtered.length > 13) {
        scrollIndicator.style.display = 'flex';
        document.getElementById('scrollText').textContent = `共 ${filtered.length} 个项目，向下滚动查看更多`;
      } else {
        scrollIndicator.style.display = 'none';
      }

      tbody.innerHTML = filtered.map(p => `
        <tr onclick="openProject('${p.id}')">
          <td>
            <span class="project-name-text">${p.name}</span>
          </td>
          <td>
            <span class="dynasty-tag">${p.dynasty}</span>
          </td>
          <td>
            <span class="status-badge ${getStatusClass(p.status)} ${isGeneratingStatus(p.status) ? 'status-generating' : ''}">
              <span class="status-dot"></span>
              ${p.statusLabel}
            </span>
          </td>
          <td>
            <span class="project-time">${p.updatedAtFormatted}</span>
          </td>
          <td>
            <div class="action-cell" id="actions-${p.id}">
              <button class="btn-icon danger" onclick="event.stopPropagation(); requestDelete('${p.id}')" title="删除">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(pill => {
        const pillText = pill.textContent.trim().split(/\s/)[0];
        pill.classList.toggle('active', 
          (filter === 'all' && pillText === '全部') ||
          (filter === 'active' && pillText === '进行中') ||
          (filter === 'completed' && pillText === '已完成')
        );
      });
      renderTable();
    }

    function sortTable(column) {
      if (sortBy === column) {
        sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
      } else {
        sortBy = column;
        sortOrder = 'desc';
      }
      
      document.querySelectorAll('.projects-table th.sortable').forEach(th => {
        th.classList.remove('sorted');
      });
      event.target.classList.add('sorted');
      
      renderTable();
    }

    function handleSearch(value) {
      searchQuery = value;
      renderTable();
    }

    function handleCreateProject() {
      alert('创建新项目');
    }

    function handleGoHome() {
      window.location.href = 'preview-landing.html';
    }

    function openProject(id) {
      console.log('Open project:', id);
      // window.location.href = `/projects/${id}/topic`;
    }

    function requestDelete(id) {
      if (deleteTargetId) {
        cancelDelete();
      }
      deleteTargetId = id;
      const actionCell = document.getElementById(`actions-${id}`);
      actionCell.innerHTML = `
        <div class="delete-confirm">
          <button class="btn-confirm" onclick="event.stopPropagation(); confirmDelete()">确认</button>
          <button class="btn-cancel-inline" onclick="event.stopPropagation(); cancelDelete()">取消</button>
        </div>
      `;
    }

    function cancelDelete() {
      if (!deleteTargetId) return;
      const actionCell = document.getElementById(`actions-${deleteTargetId}`);
      actionCell.innerHTML = `
        <button class="btn-icon danger" onclick="event.stopPropagation(); requestDelete('${deleteTargetId}')" title="删除">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      `;
      deleteTargetId = null;
    }

    function confirmDelete() {
      console.log('Delete project:', deleteTargetId);
      // Perform actual delete here
      cancelDelete();
      renderTable();
    }

    // Initial render
    renderTable();
  </script>
</body>
</html>
