<!DOCTYPE html>
<html lang="zh-CN" data-theme="forge-dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作台 · 选题列表优化版 v12</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-primary: #0d0d0d;
    --bg-secondary: #1a1614;
    --bg-card: #1f1b18;
    --bg-card-hover: #2a2522;
    --bg-panel: rgba(31, 27, 24, 0.86);
    --bg-panel-soft: rgba(26, 22, 20, 0.72);
    --bg-hover: rgba(201, 162, 39, 0.075);

    --accent-gold: #c9a227;
    --accent-gold-light: #e4c26f;
    --accent-copper: #b87333;
    --accent-bronze: #cd7f32;
    --accent-warm: #d4a574;

    --text-primary: #f5f0e8;
    --text-body: #d8cec0;
    --text-secondary: #a89f94;
    --text-muted: #6b635a;
    --text-dim: #4f4841;
    --text-inverse: #100c08;

    --border-color: #3d3632;
    --border-soft: rgba(201, 162, 39, 0.13);
    --border-active: rgba(201, 162, 39, 0.34);

    --success: #65a77a;
    --success-bg: rgba(101, 167, 122, 0.13);
    --danger: #c06454;
    --danger-bg: rgba(192, 100, 84, 0.13);
    --warning: #c9a227;
    --warning-bg: rgba(201, 162, 39, 0.13);

    --shadow-card: 0 18px 48px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.035);
    --shadow-heavy: 0 28px 76px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.04);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;

    --font-sans: "Noto Sans SC", "Inter", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    --font-serif: "Noto Serif SC", "Songti SC", Georgia, serif;
    --ease: 180ms ease;
    --ease-smooth: 260ms cubic-bezier(.2,.7,.2,1);
  }

  html, body {
    width: 100%;
    min-height: 100%;
  }

  body {
    min-width: 1180px;
    background:
      radial-gradient(ellipse at 18% 16%, rgba(184, 115, 51, 0.16) 0%, transparent 44%),
      radial-gradient(ellipse at 84% 20%, rgba(201, 162, 39, 0.11) 0%, transparent 42%),
      linear-gradient(180deg, #0b0b0a 0%, var(--bg-primary) 38%, #130f0d 100%);
    color: var(--text-body);
    font-family: var(--font-sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 82%);
    z-index: 0;
  }

  button {
    font-family: inherit;
    border: none;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  /* ===== Global Topbar: same direction as landing / my-projects ===== */

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 72px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(18px);
    background: rgba(13, 13, 13, 0.84);
    border-bottom: 1px solid rgba(201, 162, 39, 0.14);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    color: var(--accent-gold);
    display: grid;
    place-items: center;
    filter: drop-shadow(0 0 12px rgba(201, 162, 39, 0.18));
    flex-shrink: 0;
  }

  .brand-mark svg {
    width: 30px;
    height: 30px;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    line-height: 1.15;
  }

  .brand-text strong {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-primary);
  }

  .brand-text span {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .topbar-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-left: 34px;
    min-width: 0;
  }

  .topbar-right,
  .account-actions,
  .topbar-nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar-divider {
    width: 1px;
    height: 22px;
    background: var(--border-color);
    opacity: .85;
  }

  .btn {
    height: 38px;
    padding: 0 16px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: transform var(--ease), background var(--ease), border-color var(--ease), box-shadow var(--ease), color var(--ease);
    white-space: nowrap;
  }

  .btn:hover {
    transform: translateY(-1px);
  }

  .btn-ghost {
    background: rgba(255,255,255,.018);
    border: 1px solid var(--border-soft);
    color: var(--text-secondary);
  }

  .btn-ghost:hover {
    color: var(--text-primary);
    border-color: rgba(201,162,39,.30);
    background: rgba(201,162,39,.065);
  }

  .btn-primary {
    color: var(--text-inverse);
    background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-copper));
    box-shadow: 0 10px 26px rgba(184,115,51,.24);
  }

  .btn-primary:hover {
    box-shadow: 0 14px 36px rgba(201,162,39,.28);
  }

  .btn-subtle {
    height: 36px;
    padding: 0 15px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid rgba(201, 162, 39, 0.14);
    background: rgba(255,255,255,0.018);
    color: var(--text-secondary);
  }

  .btn-subtle:hover {
    color: var(--text-primary);
    border-color: rgba(201, 162, 39, 0.30);
    background: rgba(201, 162, 39, 0.07);
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 12px;
    display: inline-grid;
    place-items: center;
  }

  .btn svg,
  .icon-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* ===== App Layout ===== */

  .app-shell {
    position: relative;
    z-index: 1;
    height: 100vh;
    padding-top: 72px;
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr);
    overflow: hidden;
  }

  .sidebar {
    background:
      linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.006)),
      rgba(18, 15, 13, .88);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .project-mini {
    padding: 18px 16px 16px;
    border-bottom: 1px solid rgba(201,162,39,.10);
  }

  .project-mini-label {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .project-mini-title {
    padding: 12px;
    border: 1px solid rgba(201,162,39,.12);
    border-radius: var(--radius-md);
    background: rgba(255,255,255,.018);
  }

  .project-mini-title strong {
    display: block;
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .project-mini-title span {
    color: var(--text-muted);
    font-size: 12px;
  }

  .steps {
    flex: 1;
    padding: 12px 10px;
    overflow-y: auto;
  }

  .step {
    position: relative;
    min-height: 50px;
    padding: 11px 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background var(--ease), color var(--ease), border-color var(--ease);
  }

  .step:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .step.active {
    color: var(--accent-gold-light);
    background: rgba(201,162,39,.10);
    box-shadow: inset 0 0 0 1px rgba(201,162,39,.18);
  }

  .step.done {
    color: var(--text-body);
  }

  .step.disabled {
    opacity: .43;
    pointer-events: none;
  }

  .step-icon {
    width: 28px;
    height: 28px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    flex: 0 0 28px;
    font-size: 17px;
    background: rgba(201,162,39,.055);
    border: 1px solid rgba(201,162,39,.12);
    filter: grayscale(.15);
  }

  .step.active .step-icon {
    background: rgba(201,162,39,.13);
    border-color: rgba(201,162,39,.24);
    filter: none;
  }

  .step.done .step-icon {
    background: var(--success-bg);
    border-color: rgba(101,167,122,.22);
    filter: none;
  }

  .step-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 700;
  }

  .step-status {
    color: var(--success);
    font-size: 12px;
    font-weight: 700;
  }

  .main-area {
    min-width: 0;
    height: calc(100vh - 72px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--text-muted);
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
  }

  .breadcrumb a {
    color: var(--text-secondary);
    cursor: pointer;
    transition: color var(--ease);
  }

  .breadcrumb a:hover {
    color: var(--accent-gold);
  }

  .breadcrumb-current {
    color: var(--text-primary);
    font-weight: 750;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .breadcrumb-icon {
    font-size: 17px;
    line-height: 1;
  }

  .content-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .content-area::-webkit-scrollbar {
    width: 8px;
  }

  .content-area::-webkit-scrollbar-track {
    background: var(--bg-secondary);
  }

  .content-area::-webkit-scrollbar-thumb {
    background: var(--accent-copper);
    border-radius: 999px;
  }

  .topic-panel {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 28px 36px;
  }

  .page-title-row {
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
  }

  .page-kicker {
    margin-bottom: 10px;
    color: var(--accent-gold);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .page-title {
    font-family: var(--font-serif);
    color: var(--text-primary);
    font-size: 34px;
    line-height: 1.18;
    letter-spacing: -.03em;
    margin-bottom: 9px;
  }

  .page-title em {
    color: var(--accent-gold-light);
    font-style: normal;
  }

  .page-desc {
    max-width: 720px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .topic-actions {
    display: flex;
    gap: 10px;
  }

  .info-strip {
    min-height: 54px;
    padding: 13px 16px;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(201,162,39,.13);
    background:
      linear-gradient(90deg, rgba(201,162,39,.075), rgba(255,255,255,.014)),
      var(--bg-panel-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-card);
  }

  .info-strip-main {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .info-dot {
    width: 30px;
    height: 30px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: var(--accent-gold-light);
    background: rgba(201,162,39,.10);
    border: 1px solid rgba(201,162,39,.18);
  }

  .info-strip strong {
    color: var(--text-primary);
    font-size: 14px;
  }

  .info-strip span {
    color: var(--text-muted);
    font-size: 13px;
  }

  .info-metrics {
    display: flex;
    gap: 18px;
    color: var(--text-muted);
    font-size: 12px;
  }

  .info-metrics b {
    color: var(--accent-warm);
    font-weight: 700;
  }


  .simple-topic-title {
    margin-bottom: 18px;
    color: var(--text-primary);
    font-family: var(--font-serif);
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -.02em;
  }

  .simple-topic-title em {
    color: var(--accent-gold-light);
    font-style: normal;
  }

  .simple-topic-sub {
    margin-top: -8px;
    margin-bottom: 18px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .topic-columns {
    display: grid;
    grid-template-columns: 455px minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }

  .topic-left-col,
  .topic-right-col {
    min-width: 0;
  }

  .topic-right-col {
    position: sticky;
    top: 18px;
  }

  .panel-card {
    border-radius: var(--radius-xl);
    border: 1px solid rgba(201,162,39,.15);
    background:
      linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.008)),
      var(--bg-panel);
    box-shadow: var(--shadow-heavy);
    overflow: hidden;
  }


  .candidate-list {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .candidate-card {
    position: relative;
    display: block;
    padding: 15px 16px;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(201,162,39,.12);
    background: rgba(255,255,255,.018);
    cursor: pointer;
    transition: transform var(--ease-smooth), background var(--ease), border-color var(--ease), box-shadow var(--ease);
  }

  .candidate-card:hover {
    transform: translateX(3px);
    border-color: rgba(201,162,39,.25);
    background: rgba(201,162,39,.048);
  }

  .candidate-card.active {
    border-color: rgba(201,162,39,.46);
    background:
      linear-gradient(135deg, rgba(201,162,39,.12), rgba(184,115,51,.045)),
      rgba(255,255,255,.018);
    box-shadow: inset 0 0 0 1px rgba(201,162,39,.16), 0 14px 30px rgba(0,0,0,.18);
  }

  .candidate-body {
    min-width: 0;
  }

  .candidate-title {
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 750;
    line-height: 1.42;
    margin-bottom: 6px;
  }

  .candidate-card.active .candidate-title {
    color: var(--accent-gold-light);
  }

  .candidate-angle {
    color: var(--text-secondary);
    font-size: 12.5px;
    line-height: 1.55;
    margin-bottom: 9px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .candidate-tags {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .candidate-tag {
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid rgba(201,162,39,.12);
    background: rgba(201,162,39,.045);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 650;
  }

  .candidate-card.active .candidate-tag {
    border-color: rgba(201,162,39,.22);
    color: var(--accent-warm);
    background: rgba(201,162,39,.08);
  }


  .action-btn {
    height: 34px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid rgba(201,162,39,.14);
    background: rgba(255,255,255,.018);
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    transition: all var(--ease);
  }

  .action-btn:hover {
    color: var(--text-primary);
    border-color: rgba(201,162,39,.30);
    background: rgba(201,162,39,.07);
    transform: translateY(-1px);
  }

  .history-block {
    border-top: 1px solid rgba(201,162,39,.11);
    padding: 12px;
  }

  .history-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-toggle {
    height: 34px;
    padding: 0 4px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
  }

  .history-toggle:hover {
    color: var(--text-primary);
  }

  .toggle-arrow {
    font-size: 11px;
    transition: transform var(--ease-smooth);
  }

  .toggle-arrow.open {
    transform: rotate(90deg);
  }

  .history-rounds {
    margin-top: 10px;
    display: grid;
    gap: 8px;
  }

  .history-label {
    padding: 6px 0 2px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .history-round .candidate-card {
    padding: 12px 14px;
  }

  .history-round .candidate-title {
    font-size: 13px;
  }

  .history-round .candidate-angle {
    font-size: 12px;
    margin-bottom: 7px;
  }

  .detail-card {
    border-radius: var(--radius-xl);
    border: 1px solid rgba(201,162,39,.16);
    background:
      radial-gradient(circle at 78% 0%, rgba(201,162,39,.08), transparent 34%),
      linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.008)),
      var(--bg-panel);
    box-shadow: var(--shadow-heavy);
    overflow: hidden;
  }

  .detail-header {
    padding: 24px 26px 22px;
    border-bottom: 1px solid rgba(201,162,39,.12);
  }

  .detail-kicker {
    margin-bottom: 12px;
    color: var(--accent-gold);
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .detail-title {
    color: var(--text-primary);
    font-family: var(--font-serif);
    font-size: 25px;
    line-height: 1.34;
    letter-spacing: -.02em;
    margin-bottom: 10px;
  }

  .detail-angle {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.8;
  }

  .detail-tags {
    padding: 14px 26px;
    border-bottom: 1px solid rgba(201,162,39,.11);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .detail-tag {
    padding: 5px 12px;
    border-radius: 999px;
    color: var(--accent-warm);
    background: rgba(201,162,39,.075);
    border: 1px solid rgba(201,162,39,.16);
    font-size: 12px;
    font-weight: 700;
  }

  .detail-sections {
    padding: 6px 0;
  }

  .detail-section {
    padding: 18px 26px;
    border-bottom: 1px solid rgba(201,162,39,.10);
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr);
    gap: 14px;
  }

  .detail-section:last-child {
    border-bottom: none;
  }

  .detail-icon {
    width: 38px;
    height: 38px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(201,162,39,.14);
    background: rgba(201,162,39,.065);
    color: var(--accent-gold-light);
    font-size: 18px;
  }

  .detail-section-label {
    margin-bottom: 6px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .detail-section-text {
    color: var(--text-body);
    font-size: 13.5px;
    line-height: 1.82;
  }

  .risk-list {
    list-style: none;
    display: grid;
    gap: 6px;
  }

  .risk-item {
    position: relative;
    padding-left: 16px;
    color: var(--text-body);
    font-size: 13px;
    line-height: 1.72;
  }

  .risk-item::before {
    content: "";
    position: absolute;
    left: 1px;
    top: .78em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
  }

  .detail-footer {
    padding: 18px 26px 22px;
    border-top: 1px solid rgba(201,162,39,.12);
    background: rgba(0,0,0,.15);
  }

  .confirm-btn {
    width: 100%;
    height: 46px;
    border-radius: 13px;
    color: var(--text-inverse);
    background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-copper));
    box-shadow: 0 12px 30px rgba(184,115,51,.25);
    font-size: 15px;
    font-weight: 850;
    cursor: pointer;
    transition: transform var(--ease), box-shadow var(--ease), filter var(--ease);

    </div>
  `).join('');

  return `
    <div class="topic-panel">
      <h1 class="simple-topic-title">请选择您喜欢的<em>选题</em></h1>

      <div class="topic-columns">
        <section class="topic-left-col panel-card">
          <div class="candidate-list">
            ${mockCandidates.map(c => renderCandidateCard(c)).join('')}
          </div>

          <div class="history-block">
            <div class="history-top">
              <button class="history-toggle" onclick="toggleHistory()">
                <span class="toggle-arrow ${historyOpen ? 'open' : ''}">▶</span>
                候选历史
              </button>
              <button class="action-btn" onclick="setState('generating')">↺ 换一批</button>
            </div>
            ${historyOpen ? `<div class="history-rounds">${historySection}</div>` : ''}
          </div>
        </section>

        <aside class="topic-right-col">
          ${active ? renderDetail(active) : '<div class="detail-empty">请选择左侧候选主题</div>'}
        </aside>
      </div>
    </div>
  `;
}

function renderDetail(active) {
  return `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-kicker">Selected Topic</div>
        <h2 class="detail-title">${active.title}</h2>
        <p class="detail-angle">${active.angle}</p>
      </div>

      <div class="detail-tags">
        <span class="detail-tag">${active.family}</span>
        <span class="detail-tag">${active.scope}</span>
        ${active.rank ? `<span class="detail-tag">第 ${active.rank} 推荐</span>` : '<span class="detail-tag">历史候选</span>'}
      </div>

      <div class="detail-sections">
        <section class="detail-section">
          <div class="detail-icon">⚔️</div>
          <div>
            <div class="detail-section-label">核心冲突</div>
            <div class="detail-section-text">${active.strong_scene}</div>
          </div>
        </section>

        <section class="detail-section">
          <div class="detail-icon">📡</div>
          <div>
            <div class="detail-section-label">传播切口</div>
            <div class="detail-section-text">${active.why_now}</div>
          </div>
        </section>

        <section class="detail-section">
          <div class="detail-icon">🎭</div>
          <div>
            <div class="detail-section-label">叙事张力</div>
            <div class="detail-section-text">${active.angle}</div>
          </div>
        </section>

        <section class="detail-section">
          <div class="detail-icon">⚠️</div>
          <div>
            <div class="detail-section-label">风险提示</div>
            <ul class="risk-list">
              ${active.risk_hints.map(r => `<li class="risk-item">${r}</li>`).join('')}
            </ul>
          </div>
        </section>
      </div>

      <div class="detail-footer">
        <button class="confirm-btn" onclick="confirmTopic()">确认此选题，进入文案阶段</button>
        <div class="detail-hint">确认后将锁定主题，并开始生成 Story Brief / 口播文案。</div>
      </div>
    </div>
  `;
}

function confirmTopic() {
  const active = allCandidates().find(c => c.id === activeCandidateId) || mockCandidates[0];
  alert('已确认选题：' + active.title);
}

function updateGeneratingElapsed() {
  const elapsedEl = document.getElementById('elapsedSeconds');
  if (!elapsedEl) return;
  const seconds = Math.max(0, Math.floor((Date.now() - generatingStartedAt) / 1000));
  elapsedEl.textContent = String(seconds);
}

function syncGeneratingTimer() {
  if (generatingTimer) {
    clearInterval(generatingTimer);
    generatingTimer = null;
  }
  if (currentState === 'generating') {
    updateGeneratingElapsed();
    generatingTimer = setInterval(updateGeneratingElapsed, 1000);
  }
}

function refreshGeneratingStatus(button) {
  updateGeneratingElapsed();

  const btn = button || document.getElementById('refreshStatusBtn');
  if (!btn || btn.classList.contains('loading')) return;

  const label = btn.querySelector('.btn-label');
  btn.classList.add('loading');
  if (label) label.textContent = '刷新中';

  // 预览模拟：实际项目中这里应触发一次服务器状态查询。
  window.setTimeout(() => {
    btn.classList.remove('loading');
    if (label) label.textContent = '刷新状态';
  }, 1000);
}

function render() {
  if (currentState === 'generating') contentRoot.innerHTML = renderGenerating();
  else if (currentState === 'error') contentRoot.innerHTML = renderError();
  else contentRoot.innerHTML = renderCandidates();

  syncGeneratingTimer();
}

stateBtns.forEach(btn => {
  btn.addEventListener('click', () => setState(btn.dataset.state));
});

render();
</script>
</body>
</html>
